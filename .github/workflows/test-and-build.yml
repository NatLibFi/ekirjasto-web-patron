name: Test and Build

on:
  pull_request:
    paths-ignore:
      - '**/README.md'
      - '**/LICENSE'
      - '**/.gitignore'
      - 'CHANGELOG.md'
  push:
    paths-ignore:
      - '**/README.md'
      - '**/LICENSE'
      - '**/.gitignore'
      - 'CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: npm run lint
          - name: Typecheck
            command: npm run typecheck
          - name: Test & Coverage
            command: npm run test:ci -- --coverage --runInBand
          - name: Production Build
            command: npm run build
    env:
      CI: true
      CYPRESS_INSTALL_BINARY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      CONFIG_FILE: .github/fixtures/build.yml
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Cache Next.js build
        if: matrix.name == 'Production Build'
        uses: actions/cache@v6.1.0
        with:
          path: _next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('.nvmrc', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('.nvmrc', 'package-lock.json') }}-

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
