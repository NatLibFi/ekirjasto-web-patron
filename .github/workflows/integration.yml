# Dispatch the existing external integration suite when main changes.
name: Integration

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Trigger integration workflow
        uses: actions/github-script@v9.0.0
        env:
          BUILD_NAME: ${{ github.ref }}.${{ github.sha }}
        with:
          github-token: ${{ secrets.SIMPLIFIED_CI_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: "ThePalaceProject",
              repo: "web-integration-tests",
              workflow_id: "maven.yml",
              ref: "main",
              inputs: {
                test_tag: "(@tier1 or @tier2 or @tier3)",
                build_name: process.env.BUILD_NAME,
                browser_name: "chrome",
                browser_type: "desktop"
              }
            });
